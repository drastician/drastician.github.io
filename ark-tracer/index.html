<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARK Resolution Inspector | A Vibe Coded Tool by Richard</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #1a1d20;
      --text-muted: #5a626a;
      --border-color: #e2e8f0;
      --accent-color: #2563eb;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 1.5rem 1rem;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    /* Top Brand Navigation */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding: 0 0.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      color: inherit;
    }

    /* Enlarged GIF Styling */
    .brand-gif {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .nav-link {
      font-size: 0.875rem;
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 500;
    }
    .nav-link:hover { text-decoration: underline; }

    /* Tool Card Container */
    .tool-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }

    .tool-header {
      padding: 1.5rem 1.75rem;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
    }

    .tool-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .tool-header p {
      font-size: 0.925rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      max-width: 780px;
    }

    .iframe-container {
      width: 100%;
      height: 780px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 600px) {
      .iframe-container {
        height: 950px;
      }
      .brand-gif {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header / Nav with Larger GIF -->
    <header>
      <a href="/" class="brand">
        <img 
          src="https://64.media.tumblr.com/05a200f2490b8b4f0a31b30dbb2d9d6a/tumblr_n2njy7RWTW1rn3gulo1_500.gifv" 
          alt="Avatar GIF" 
          class="brand-gif" 
        />
        <span class="brand-title">ARK Resolution Inspector | A Vibe Coded Tool by Richard</span>
      </a>
      <a href="/" class="nav-link">← Back to Main Page</a>
    </header>

    <!-- Main Tool Container -->
    <main class="tool-card">
      <div class="tool-header">
        <h1>Persistent Identifier Diagnostics & Resolution Path</h1>
        <p>This traces an Archival Resource Key's HTTP redirect steps, and shows the registered N2T ERC metadata for whatever persistent URIs you put in.</p>
      </div>

      <div class="iframe-container">
        <!-- Live Streamlit App -->
        <iframe 
          src="https://ark-tracer-ecgycjmezww7ouczmeqvno.streamlit.app/?embed=true" 
          title="ARK Resolution Inspector Tool">
        </iframe>
      </div>
    </main>
  </div>

</body>
</html>
